<!DOCTYPE html>
<html lang="en">
<head>
  <title>Short-Term Precipitation Forecast</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; }

    #map-title {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.9);
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 22px;
      font-weight: bold;
      z-index: 1000;
      white-space: nowrap;
    }

    /* --- Controls bar at bottom-left (mirrors Leaflet control style) --- */
    #controls {
      position: absolute;
      bottom: 20px;
      left: 10px;
      background: rgba(255,255,255,0.92);
      border-radius: 8px;
      padding: 10px 14px;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 260px;
    }

    #timestamp {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      text-align: center;
    }

    .btn-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-row label {
      font-size: 12px;
      color: #555;
      white-space: nowrap;
    }

    .ctrl-btn {
      width: 36px;
      height: 32px;
      border: 1px solid #bbb;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ctrl-btn:hover { background: #eee; }

    #playBtn { width: 44px; font-size: 18px; }

    input[type=range] {
      flex: 1;
      height: 4px;
      accent-color: #2979ff;
    }

    /* --- Legend --- */
    #legend-toggle {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(34,34,34,0.85);
      color: white;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      z-index: 1000;
      user-select: none;
    }

    #map-legend {
      position: absolute;
      bottom: 65px;
      right: 20px;
      background: rgba(34,34,34,0.88);
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      width: 185px;
      display: none;
      z-index: 1000;
    }

    .legend-title { font-weight: bold; margin: 6px 0 4px; font-size: 14px; }
    .legend-title:first-child { margin-top: 0; }

    .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
    .legend-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      margin-right: 8px;
      flex-shrink: 0;
    }

    #mapid { width: 100%; height: 100vh; }
  </style>
</head>
<body>

<div id="map-title">Short-Term Precipitation Forecast</div>

<div id="controls">
  <div id="timestamp">Loading radar data…</div>
  <div class="btn-row">
    <button class="ctrl-btn" title="Previous frame" onclick="stepFrame(-1)">&#8249;</button>
    <button class="ctrl-btn" id="playBtn" title="Play / Pause" onclick="playStop()">&#9654;</button>
    <button class="ctrl-btn" title="Next frame"     onclick="stepFrame(+1)">&#8250;</button>
    <label>Time</label>
    <input type="range" id="timeSlider" min="0" value="0"
           oninput="onSliderChange(this.value)" />
  </div>
  <div class="btn-row">
    <label>Opacity</label>
    <input type="range" id="opacitySlider" min="0" max="100" value="80"
           oninput="setOpacity(this.value/100)" />
  </div>
</div>

<div id="legend-toggle">Show Legend</div>

<div id="map-legend">
  <div class="legend-title">RAIN</div>
  <div class="legend-item"><div class="legend-dot" style="background:#32CD32"></div><span>Overcast</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#228B22"></div><span>Drizzle</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#006400"></div><span>Light rain</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#FFFF00"></div><span>Moderate rain</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#FF4500"></div><span>Shower</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#8B0000"></div><span>Hail</span></div>
  <div class="legend-title">SNOW</div>
  <div class="legend-item"><div class="legend-dot" style="background:#B0E0E6"></div><span>Light</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#4682B4"></div><span>Moderate</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#00008B"></div><span>Heavy</span></div>
</div>

<div id="mapid"></div>

<script>
  // ── Map setup ──────────────────────────────────────────────────
  var map = L.map('mapid').setView([51.505, 18.09], 6);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    minZoom: 3, maxZoom: 12,
    attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors'
  }).addTo(map);

  // ── State ──────────────────────────────────────────────────────
  var TILE_SIZE      = window.devicePixelRatio >= 2 ? 512 : 256;
  var radarOpacity   = 0.80;
  var ANIM_DELAY_MS  = 600;
  var API_URL        = 'https://api.rainviewer.com/public/weather-maps.json';

  var apiData        = {};
  var mapFrames      = [];
  var animPosition   = 0;
  var animTimer      = null;
  var currentLayer   = null;
  var isLoading      = false;
  var layerCache     = {};

  // ── Helpers ────────────────────────────────────────────────────
  function wrap(pos) {
    var n = mapFrames.length;
    return ((pos % n) + n) % n;
  }

  function fmtTime(ts) {
    return new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function updateUI(frame) {
    document.getElementById('timestamp').textContent = fmtTime(frame.time);
    var slider = document.getElementById('timeSlider');
    slider.value = animPosition;
  }

  // ── Layers ─────────────────────────────────────────────────────
  function makeLayer(frame) {
    return L.tileLayer(
      apiData.host + frame.path + '/' + TILE_SIZE + '/{z}/{x}/{y}/2/1_1.png',
      { tileSize: 256, opacity: 0.001, maxNativeZoom: 7, maxZoom: 12 }
    );
  }

  function setOpacity(val) {
    radarOpacity = val;
    if (currentLayer) currentLayer.setOpacity(val);
  }

  function showFrame(pos) {
    if (isLoading) return;
    pos = wrap(pos);
    var frame = mapFrames[pos];
    updateUI(frame);

    var oldLayer = currentLayer;

    if (layerCache[pos]) {
      if (oldLayer && oldLayer !== layerCache[pos]) oldLayer.setOpacity(0);
      layerCache[pos].setOpacity(radarOpacity);
      currentLayer  = layerCache[pos];
      animPosition  = pos;
      if (animTimer !== null) animTimer = setTimeout(advanceFrame, ANIM_DELAY_MS);
      return;
    }

    isLoading = true;
    var newLayer = makeLayer(frame);
    newLayer.on('load', function () {
      newLayer.setOpacity(radarOpacity);
      if (oldLayer && oldLayer !== newLayer) oldLayer.setOpacity(0);
      layerCache[pos] = newLayer;
      currentLayer    = newLayer;
      animPosition    = pos;
      isLoading       = false;
      if (animTimer !== null) animTimer = setTimeout(advanceFrame, ANIM_DELAY_MS);
    });
    newLayer.addTo(map);
  }

  // ── Playback ───────────────────────────────────────────────────
  function advanceFrame() {
    if (animTimer === null) return;
    showFrame(animPosition + 1);
  }

  function play() {
    animTimer = true; // flag: playing
    document.getElementById('playBtn').innerHTML = '&#9646;&#9646;';
    showFrame(animPosition + 1);
  }

  function stopAnim() {
    var wasPlaying = animTimer !== null;
    clearTimeout(animTimer);
    animTimer = null;
    document.getElementById('playBtn').innerHTML = '&#9654;';
    return wasPlaying;
  }

  function playStop() {
    if (animTimer !== null) { stopAnim(); } else { play(); }
  }

  function stepFrame(delta) {
    stopAnim();
    showFrame(animPosition + delta);
  }

  function onSliderChange(val) {
    stopAnim();
    showFrame(parseInt(val, 10));
  }

  // ── Init ───────────────────────────────────────────────────────
  function initialize(api) {
    // clear old cache
    for (var k in layerCache) {
      map.removeLayer(layerCache[k]);
    }
    layerCache    = {};
    currentLayer  = null;
    mapFrames     = [];
    animPosition  = 0;
    stopAnim();

    if (!api || !api.radar || !api.radar.past) {
      document.getElementById('timestamp').textContent = 'No data available';
      return;
    }

    mapFrames = api.radar.past;
    var slider = document.getElementById('timeSlider');
    slider.max = mapFrames.length - 1;
    slider.value = mapFrames.length - 1;

    showFrame(mapFrames.length - 1);
  }

  function loadApi() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', API_URL, true);
    xhr.onload = function () {
      apiData = JSON.parse(xhr.response);
      initialize(apiData);
    };
    xhr.onerror = function () {
      document.getElementById('timestamp').textContent = 'Failed to load radar';
    };
    xhr.send();
  }

  map.on('movestart', function () {
    for (var k in layerCache) {
      if (parseInt(k) !== animPosition) {
        map.removeLayer(layerCache[k]);
        delete layerCache[k];
      }
    }
  });

  loadApi();

  // ── Legend toggle ──────────────────────────────────────────────
  var legendToggle = document.getElementById('legend-toggle');
  var mapLegend    = document.getElementById('map-legend');

  legendToggle.addEventListener('click', function () {
    var hidden = mapLegend.style.display === 'none' || mapLegend.style.display === '';
    mapLegend.style.display = hidden ? 'block' : 'none';
    legendToggle.textContent = hidden ? 'Hide Legend' : 'Show Legend';
  });
</script>

</body>
</html>
